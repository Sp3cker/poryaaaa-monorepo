# Rust shell for the poryaaaa CLAP plugin.
[package]
name = "poryaaaa-clap-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "poryaaaa_clap_plugin"
crate-type = ["rlib", "cdylib"]

[dependencies]
egui = { version = "=0.34.1", features = ["default_fonts"] }
nice-plug = { git = "https://codeberg.org/RustAudio/nice-plug.git", rev = "a80e0e267e52027be4bc07480bef77e798d3342c", default-features = false }
nice-plug-egui = { git = "https://codeberg.org/RustAudio/nice-plug.git", rev = "a80e0e267e52027be4bc07480bef77e798d3342c" }
voicegroup-core = { path = "../../voicegroup-core" }
