# Rust shell for the poryaaaa CLAP plugin.
[package]
name = "poryaaaa-clap-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "poryaaaa_clap_plugin"
crate-type = ["rlib", "cdylib"]

[dependencies]
nice-plug = { path = "../../../third_party/nice-plug/crates/nice-plug", default-features = false }
nice-plug-iced = { path = "../../../third_party/nice-plug/crates/nice-plug-iced", features = ["canvas"] }
iced_audio = { version = "0.14.1", features = ["nice-plug"] }
rfd = "0.15"
voicegroup-core = { path = "../../voicegroup-core" }

[patch.crates-io]
nice-plug-core = { path = "../../../third_party/nice-plug/crates/nice-plug-core" }

[build-dependencies]
cc = "1"
